name: User Service CI/CD

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test with Maven
        run: mvn clean test jacoco:report -B
        working-directory: ./user-service

      - name: Verify JaCoCo report exists
        run: ls -l target/site/jacoco/jacoco.xml
        working-directory: ./user-service

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: ./user-service
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          dockerfile: ./user-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-to-azure:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az containerapp registry set \
              --name sms-user-service \
              --resource-group sms-resource-group \
              --server ghcr.io \
              --username ${{ github.actor }} \
              --password ${{ secrets.GHCR_PAT }}
            az containerapp secret set \
              --name sms-user-service \
              --resource-group sms-resource-group \
              --secrets \
                db-host="${{ secrets.DB_HOST }}" \
                db-port="${{ secrets.DB_PORT }}" \
                db-name="${{ secrets.DB_NAME }}" \
                db-user="${{ secrets.DB_USER }}" \
                db-password="${{ secrets.DB_PASSWORD }}" \
                db-sslmode="${{ secrets.DB_SSLMODE }}" \
                jwt-secret="${{ secrets.JWT_SECRET }}" \
                jwt-expiration="${{ secrets.JWT_EXPIRATION }}" \
                kafka-bootstrap-servers="${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}" \
                kafka-security-protocol="${{ secrets.KAFKA_SECURITY_PROTOCOL }}" \
                kafka-sasl-mechanism="${{ secrets.KAFKA_SASL_MECHANISM }}" \
                kafka-sasl-jaas-config="${{ secrets.KAFKA_SASL_JAAS_CONFIG }}" \
                auth-service-url="${{ secrets.AUTH_SERVICE_URL }}"
            az containerapp update \
              --name sms-user-service \
              --resource-group sms-resource-group \
              --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
              --set-env-vars \
                DB_HOST=secretref:db-host \
                DB_PORT=secretref:db-port \
                DB_NAME=secretref:db-name \
                DB_USER=secretref:db-user \
                DB_PASSWORD=secretref:db-password \
                DB_SSLMODE=secretref:db-sslmode \
                JWT_SECRET=secretref:jwt-secret \
                JWT_EXPIRATION=secretref:jwt-expiration \
                KAFKA_BOOTSTRAP_SERVERS=secretref:kafka-bootstrap-servers \
                SPRING_KAFKA_BOOTSTRAP_SERVERS=secretref:kafka-bootstrap-servers \
                SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL=secretref:kafka-security-protocol \
                SPRING_KAFKA_PROPERTIES_SASL_MECHANISM=secretref:kafka-sasl-mechanism \
                SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG=secretref:kafka-sasl-jaas-config \
                AUTH_SERVICE_URL=secretref:auth-service-url

