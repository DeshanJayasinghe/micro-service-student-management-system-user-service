name: User Service CI/CD

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test with Maven
        run: mvn clean test jacoco:report -B
        working-directory: ./user-service

      - name: Verify JaCoCo report exists
        run: ls -l target/site/jacoco/jacoco.xml
        working-directory: ./user-service

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: ./user-service
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          dockerfile: ./user-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-to-azure:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Container App secrets and environment
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp || true

          IMAGE_REF=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" | tr '[:upper:]' '[:lower:]')

          PROVISION_STATE=$(az containerapp show \
            --name sms-user-service \
            --resource-group sms-resource-group \
            --query "properties.provisioningState" -o tsv 2>/dev/null || echo "NotFound")

          if [ "$PROVISION_STATE" != "Succeeded" ]; then
            echo "Container App not ready (state: $PROVISION_STATE). Creating..."
            az containerapp create \
              --name sms-user-service \
              --resource-group sms-resource-group \
              --environment sms-environment \
              --image "$IMAGE_REF" \
              --registry-server ghcr.io \
              --registry-username ${{ github.actor }} \
              --registry-password ${{ secrets.GITHUB_TOKEN }} \
              --target-port 8082 \
              --ingress external \
              --min-replicas 1 \
              --secrets \
                eh-jaas="org.apache.kafka.common.security.plain.PlainLoginModule required username=\"\$ConnectionString\" password=\"${{ secrets.EVENTHUB_CONN }}\";" \
                db-password="${{ secrets.DB_PASSWORD }}" \
                jwt-secret="${{ secrets.JWT_SECRET }}" \
              --env-vars \
                SPRING_KAFKA_BOOTSTRAP_SERVERS="sms-kafka-ns-v3.servicebus.windows.net:9093" \
                SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL="SASL_SSL" \
                SPRING_KAFKA_PROPERTIES_SASL_MECHANISM="PLAIN" \
                SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG="secretref:eh-jaas" \
                DB_HOST="${{ secrets.DB_HOST }}" \
                DB_PORT="5433" \
                DB_USER="${{ secrets.DB_USER }}" \
                DB_PASSWORD="secretref:db-password" \
                JWT_SECRET="secretref:jwt-secret" \
                AUTH_SERVICE_URL="${{ secrets.AUTH_SERVICE_URL }}" \
                KAFKA_BOOTSTRAP_SERVERS="sms-kafka-ns-v3.servicebus.windows.net:9093"
          else
            echo "Container App exists. Updating secrets and image..."
            az containerapp secret set \
              --name sms-user-service \
              --resource-group sms-resource-group \
              --secrets \
                eh-jaas="org.apache.kafka.common.security.plain.PlainLoginModule required username=\"\$ConnectionString\" password=\"${{ secrets.EVENTHUB_CONN }}\";" \
                db-password="${{ secrets.DB_PASSWORD }}" \
                jwt-secret="${{ secrets.JWT_SECRET }}"

            az containerapp update \
              --name sms-user-service \
              --resource-group sms-resource-group \
              --image "$IMAGE_REF" \
              --set-env-vars \
                SPRING_KAFKA_BOOTSTRAP_SERVERS="sms-kafka-ns-v3.servicebus.windows.net:9093" \
                SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL="SASL_SSL" \
                SPRING_KAFKA_PROPERTIES_SASL_MECHANISM="PLAIN" \
                SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG="secretref:eh-jaas" \
                DB_HOST="${{ secrets.DB_HOST }}" \
                DB_PORT="5433" \
                DB_USER="${{ secrets.DB_USER }}" \
                DB_PASSWORD="secretref:db-password" \
                JWT_SECRET="secretref:jwt-secret" \
                AUTH_SERVICE_URL="${{ secrets.AUTH_SERVICE_URL }}" \
                KAFKA_BOOTSTRAP_SERVERS="sms-kafka-ns-v3.servicebus.windows.net:9093"
          fi

